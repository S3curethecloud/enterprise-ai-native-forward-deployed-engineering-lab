name: Phase 3 CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase3-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality and contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/development.lock

      - name: Install hash-locked development dependencies
        run: |
          python -m pip install \
            --require-hashes \
            --requirement requirements/development.lock
          python -m pip install \
            --no-deps \
            --no-build-isolation \
            --editable .

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run Ruff linting
        run: python -m ruff check src tests

      - name: Verify Ruff formatting
        run: python -m ruff format --check src tests

      - name: Run strict type checking
        run: python -m mypy src tests

      - name: Run tests with branch coverage
        run: |
          python -m pytest \
            --cov=incident_diagnostic_api \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -q

      - name: Upload coverage evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase3-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  containers:
    name: Local container build and health verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build bounded local image
        run: docker compose build

      - name: Start local services
        run: docker compose up --detach --wait --wait-timeout 60

      - name: Verify service health endpoints
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:8000/health
          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:8001/health
          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:8002/health

      - name: Verify service readiness endpoints
        run: |
          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:8000/ready
          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:8001/ready
          curl \
            --fail \
            --silent \
            --show-error \
            http://127.0.0.1:8002/ready

      - name: Record container status
        if: always()
        run: docker compose ps --all

      - name: Record container logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop local services
        if: always()
        run: docker compose down --volumes --remove-orphans
