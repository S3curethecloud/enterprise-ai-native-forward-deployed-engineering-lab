name: Phase 3 CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phase3-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Python quality and contract tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python 3.12
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements/development.lock

      - name: Install hash-locked development dependencies
        run: |
          python -m pip install \
            --require-hashes \
            --requirement requirements/development.lock
          python -m pip install \
            --no-deps \
            --no-build-isolation \
            --editable .

      - name: Check installed dependencies
        run: python -m pip check

      - name: Run Ruff linting
        run: python -m ruff check src tests

      - name: Verify Ruff formatting
        run: python -m ruff format --check src tests

      - name: Run strict type checking
        run: python -m mypy src tests

      - name: Run tests with branch coverage
        run: |
          python -m pytest \
            --cov=incident_diagnostic_api \
            --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            -q

      - name: Upload coverage evidence
        uses: actions/upload-artifact@v6
        with:
          name: phase3-coverage
          path: coverage.xml
          if-no-files-found: error
          retention-days: 14

  containers:
    name: Local container build and health verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Compose configuration
        run: docker compose config --quiet

      - name: Build bounded local image
        run: docker compose build

      - name: Start isolated local services
        run: docker compose up --detach --wait --wait-timeout 60

      - name: Verify no host ports are published
        run: |
          for service in gateway runtime evidence
          do
            container_id="$(docker compose ps --quiet "$service")"

            if [ -z "$container_id" ]; then
              echo "FAIL: no container exists for $service"
              exit 1
            fi

            published_bindings="$(
              docker inspect \
                --format='{{range $port, $bindings := .NetworkSettings.Ports}}{{if $bindings}}{{$port}}={{json $bindings}}{{end}}{{end}}' \
                "$container_id"
            )"

            if [ -n "$published_bindings" ]; then
              echo "FAIL: $service publishes a host port"
              printf '%s\n' "$published_bindings"
              exit 1
            fi

            echo "PASS: $service publishes no host port"
          done

      - name: Verify internal network isolation
        run: |
          gateway_id="$(docker compose ps --quiet gateway)"

          network_name="$(
            docker inspect \
              --format='{{range $name, $_ := .NetworkSettings.Networks}}{{$name}}{{end}}' \
              "$gateway_id"
          )"

          internal="$(
            docker network inspect \
              --format='{{.Internal}}' \
              "$network_name"
          )"

          if [ "$internal" != "true" ]; then
            echo "FAIL: $network_name is not internal"
            exit 1
          fi

          echo "PASS: $network_name is internally isolated"

      - name: Verify container runtime restrictions
        run: |
          for service in gateway runtime evidence
          do
            container_id="$(docker compose ps --quiet "$service")"

            user="$(
              docker inspect \
                --format='{{.Config.User}}' \
                "$container_id"
            )"

            read_only="$(
              docker inspect \
                --format='{{.HostConfig.ReadonlyRootfs}}' \
                "$container_id"
            )"

            cap_drop="$(
              docker inspect \
                --format='{{json .HostConfig.CapDrop}}' \
                "$container_id"
            )"

            security_opt="$(
              docker inspect \
                --format='{{json .HostConfig.SecurityOpt}}' \
                "$container_id"
            )"

            if [ "$user" != "10001:10001" ]; then
              echo "FAIL: $service uses unexpected identity $user"
              exit 1
            fi

            if [ "$read_only" != "true" ]; then
              echo "FAIL: $service root filesystem is writable"
              exit 1
            fi

            if [[ "$cap_drop" != *"ALL"* ]]; then
              echo "FAIL: $service does not drop all capabilities"
              exit 1
            fi

            if [[ "$security_opt" != *"no-new-privileges:true"* ]]; then
              echo "FAIL: $service lacks no-new-privileges"
              exit 1
            fi

            echo "PASS: $service runtime restrictions are active"
          done

      - name: Verify service health inside containers
        run: |
          docker compose exec --no-TTY gateway \
            python -c "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2); raise SystemExit(0 if response.status == 200 else 1)"

          docker compose exec --no-TTY runtime \
            python -c "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=2); raise SystemExit(0 if response.status == 200 else 1)"

          docker compose exec --no-TTY evidence \
            python -c "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8002/health', timeout=2); raise SystemExit(0 if response.status == 200 else 1)"

      - name: Verify service readiness inside containers
        run: |
          docker compose exec --no-TTY gateway \
            python -c "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=2); raise SystemExit(0 if response.status == 200 else 1)"

          docker compose exec --no-TTY runtime \
            python -c "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8001/ready', timeout=2); raise SystemExit(0 if response.status == 200 else 1)"

          docker compose exec --no-TTY evidence \
            python -c "import urllib.request; response = urllib.request.urlopen('http://127.0.0.1:8002/ready', timeout=2); raise SystemExit(0 if response.status == 200 else 1)"

      - name: Record container status
        if: always()
        run: docker compose ps --all

      - name: Record container logs
        if: always()
        run: docker compose logs --no-color

      - name: Stop isolated local services
        if: always()
        run: docker compose down --volumes --remove-orphans
